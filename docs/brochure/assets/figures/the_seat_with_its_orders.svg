<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">The seat with its orders</title>
<desc id="desc">The human writes three orders for the seat: the feature's decisions, the standing orders, and the switches. A session in the seat reads all three before every act, and it acts in two places only: it answers and merges on the pull requests, when its switches allow, and commits to the main branch to start the next story or fix a small finding. The session writes a line for every act into a log on the project's main branch, which runs back to the human. Closing and discarding stay with the human alone, drawn as the one edge from the human straight to the factory.</desc>
