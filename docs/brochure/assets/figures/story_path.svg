.n-agent .tag, .k-agent { fill: #245a99; }
.g-agent { stroke: #2f6db5; }
.n-back .sh { fill: #fdf0e5; stroke: #d0661a; }
.n-back .fold { fill: #f4d4bc; stroke: #d0661a; }
