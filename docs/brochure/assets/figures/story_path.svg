.g-back { stroke: #d0661a; }
.e-flow { stroke: #4b515c; } .ah-flow { fill: #4b515c; }
.lb-flow { fill: #2b3038; }
.e-back { stroke: #d0661a; } .ah-back { fill: #d0661a; }
.lb-back { fill: #9c490d; }
.e-ask { stroke: #7a4fb5; } .ah-ask { fill: #7a4fb5; }
.lb-ask { fill: #613a96; }

</style>
