<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">The story's path</title>
<desc id="desc">The running story's path as eleven boxes in reading order, each tagged with the minute it began, counted from the story's first journal entry. Three questions, from the intake, the tester, and the coder, rise to the human and come back after waits of 79, 142, and 143 seconds. The first review sends the story back, and round 1 runs the coder, the tester, and the coder again before a second review finds nothing. The documents, the smoke test, and the merge follow in under three minutes, and the merge comes at minute 61.</desc>
<style>
