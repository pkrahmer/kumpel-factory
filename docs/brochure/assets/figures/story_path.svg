.tx-note { font-size: 36px; font-weight: 400; font-style: italic; }
.lg { font-size: 32px; font-weight: 400; }
.sh, .fold { stroke-width: 3; stroke-linejoin: round; }
.n-end .sh, .n-dashed .sh { stroke-dasharray: 14 8; }
.e { fill: none; stroke-linejoin: round; stroke-linecap: butt; }
