<g class="n-agent"><rect class="sh" x="48" y="200" width="304" height="176" rx="16"/><text class="nt" x="200" y="276.28" text-anchor="middle">Intake</text><text class="nb" x="200" y="330.24" text-anchor="middle">reads the story</text></g>
<g class="n-agent"><rect class="sh" x="448" y="200" width="304" height="176" rx="16"/><text class="nt" x="600" y="276.28" text-anchor="middle">Tests</text><text class="nb" x="600" y="330.24" text-anchor="middle">writes tests</text></g>
<g class="n-agent"><rect class="sh" x="848" y="200" width="304" height="176" rx="16"/><text class="nt" x="1000" y="276.28" text-anchor="middle">Doing</text><text class="nb" x="1000" y="330.24" text-anchor="middle">writes code</text></g>
<g class="n-agent"><rect class="sh" x="1248" y="200" width="304" height="176" rx="16"/><text class="tag" x="1400" y="245.52" text-anchor="middle">CAP 2</text><text class="nt" x="1400" y="294.28" text-anchor="middle">Review</text><text class="nb" x="1400" y="348.24" text-anchor="middle">judges change</text></g>
<g class="n-agent"><rect class="sh" x="1248" y="512" width="304" height="176" rx="16"/><text class="tag" x="1400" y="557.52" text-anchor="middle">CAP 2</text><text class="nt" x="1400" y="606.28" text-anchor="middle">Docs</text><text class="nb" x="1400" y="660.24" text-anchor="middle">writes docs</text></g>
<g class="n-agent"><rect class="sh" x="848" y="512" width="304" height="176" rx="16"/><text class="tag" x="1000" y="557.52" text-anchor="middle">CAP 2</text><text class="nt" x="1000" y="606.28" text-anchor="middle">Smoke test</text><text class="nb" x="1000" y="660.24" text-anchor="middle">runs the script</text></g>
