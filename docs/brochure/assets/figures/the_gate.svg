<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">The gate</title>
<desc id="desc">The figure shows the checks that every change to the factory's own project must pass before a stage may end, as nine boxes in three rows of three. Seven green boxes, lint, types, layers, sast, secrets, licenses, and test, are the checks of the one command, make check, each with its target name and in plain words what it checks. Two more green boxes mark what the factory runs itself after the docs stage: the secrets scan again, over the changed files, and the documents check. The slate box at the end, duplicates, is only a record taken after the coder, which the reviewer reads and which never stops a stage. This is the gate of the factory's own project; another project brings its own checks under the same target names.</desc>
