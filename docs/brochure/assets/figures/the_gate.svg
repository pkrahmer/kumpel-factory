<g class="n-code"><rect class="sh" x="848" y="304" width="304" height="216" rx="16"/><text class="tag" x="1000" y="347.52" text-anchor="middle">IN THE GATE</text><text class="nt" x="1000" y="396.28" text-anchor="middle">test</text><text class="nb" x="1000" y="450.24" text-anchor="middle">tests, 90 % of</text><text class="nb" x="1000" y="494.24" text-anchor="middle">branches</text></g>
