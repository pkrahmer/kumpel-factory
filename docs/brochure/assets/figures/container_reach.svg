<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">What the agent's container reaches</title>
<desc id="desc">The agent runs inside a throwaway container and reaches three things from there: the dataset, which it may read and write, its login and instructions files, which it may only read, and the network, for the model's API and the package index. Out of its reach, on the machine, lie the hosting token, the factory's clone of the repository, and the factory's own settings. Only the factory, running on the machine as an ordinary user, holds those and commits and pushes. The take is the one way anything of the agent's reaches the factory's clone, and figure 8-2 shows it.</desc>
