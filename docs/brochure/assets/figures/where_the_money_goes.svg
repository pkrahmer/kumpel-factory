<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<!-- drawn from 281 cost sidecars, 2127 lines, $750.93 in all; cost by stage: tests $174.49 (23.2 %), review $165.50 (22.0 %), doing $148.35 (19.8 %), acceptance $147.70 (19.7 %), smoke test $44.05 (5.9 %), docs $41.53 (5.5 %), intake $29.32 (3.9 %); the top 4 hold 84.7 % -->
<title id="title">Where the money goes</title>
<desc id="desc">Seven horizontal bars show the list price of every agent run summed by stage, over the whole record of $750.93. From the top, the tests stage cost $174, the review $166, the coder's stage $148, and the acceptance $148, and below them the short bars of the smoke test at $44, the documents at $42, and the intake at $29. The four tall bars hold more than four fifths of the money. Checking, in the review and the acceptance, costs about as much as writing, in the tests and the code.</desc>
