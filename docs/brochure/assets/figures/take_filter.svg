<path class="e e-dashed" d="M 592 440 L 592 584" marker-end="url(#ah-dashed)"/>
<path class="e e-dashed" d="M 992 440 L 992 584" marker-end="url(#ah-dashed)"/>
<path class="e e-flow" d="M 1152 268 L 1248 268" marker-end="url(#ah-flow)"/>
<g class="n-data"><path class="sh" d="M 58 128 H 320 L 360 168 V 398 Q 360 408 350 408 H 58 Q 48 408 48 398 V 138 Q 48 128 58 128 Z"/><path class="fold" d="M 320 128 V 162 Q 320 168 326 168 H 360 Z"/><text class="tag" x="204" y="199.52" text-anchor="middle">AFTER THE RUN</text><text class="nt" x="204" y="248.28" text-anchor="middle">Changed</text><text class="nt" x="204" y="300.28" text-anchor="middle">files</text><text class="nb" x="204" y="354.24" text-anchor="middle">from the base</text></g>
<g class="n-code"><polygon class="sh" points="592,96 752,268 592,440 432,268"/><text class="tag" x="592" y="225.52" text-anchor="middle">TEST 1</text><text class="nt" x="592" y="274.28" text-anchor="middle">In the</text><text class="nt" x="592" y="326.28" text-anchor="middle">copy?</text></g>
<g class="n-code"><polygon class="sh" points="992,96 1152,268 992,440 832,268"/><text class="tag" x="992" y="199.52" text-anchor="middle">TEST 2</text><text class="nt" x="992" y="248.28" text-anchor="middle">Coder</text><text class="nt" x="992" y="300.28" text-anchor="middle">may</text><text class="nt" x="992" y="352.28" text-anchor="middle">write?</text></g>
<g class="n-store"><path class="sh" d="M 1256 148 A 148 20 0 0 1 1552 148 V 388 A 148 20 0 0 1 1256 388 Z"/><ellipse class="fold" cx="1404" cy="148" rx="148" ry="20"/><text class="tag" x="1404" y="245.52" text-anchor="middle">FACTORY'S</text><text class="nt" x="1404" y="294.28" text-anchor="middle">Clone</text><text class="nb" x="1404" y="348.24" text-anchor="middle"><tspan class="code">src/new.py</tspan></text></g>
<g class="n-quiet"><rect class="sh" x="416" y="592" width="352" height="184" rx="16"/><text class="nt" x="592" y="650.28" text-anchor="middle">Dropped</text><text class="nb" x="592" y="704.24" text-anchor="middle"><tspan class="code">home/</tspan></text><text class="nb" x="592" y="748.24" text-anchor="middle"><tspan class="code">.git</tspan>, <tspan class="code">.venv/</tspan></text></g>
<g class="n-quiet"><rect class="sh" x="784" y="592" width="416" height="272" rx="16"/><text class="nt" x="992" y="650.28" text-anchor="middle">Left out</text><text class="nb" x="992" y="704.24" text-anchor="middle"><tspan class="code">tests/...</tspan></text><text class="nb" x="992" y="748.24" text-anchor="middle"><tspan class="code">src/.claude/...</tspan></text><text class="nb" x="992" y="792.24" text-anchor="middle">the work item</text><text class="nb" x="992" y="836.24" text-anchor="middle">named in journal</text></g>
<rect class="halo" x="752.98" y="214" width="78.03" height="44" rx="6"/><text class="lb lb-flow" x="792" y="246.24" text-anchor="middle">yes</text>
<rect class="halo" x="602" y="496" width="60.16" height="44" rx="6"/><text class="lb lb-dashed" x="610" y="528.24" text-anchor="start">no</text>
<rect class="halo" x="1002" y="496" width="60.16" height="44" rx="6"/><text class="lb lb-dashed" x="1010" y="528.24" text-anchor="start">no</text>
<rect class="halo" x="1152.52" y="214" width="102.95" height="44" rx="6"/><text class="lb lb-flow" x="1204" y="246.24" text-anchor="middle">copy</text>
<g class="n-code"><rect class="sh" x="48" y="918" width="64" height="30" rx="6"/></g><text class="lg" x="128" y="944" text-anchor="start">Kumpel's code</text>
<g class="n-data"><rect class="sh" x="408.4" y="918" width="64" height="30" rx="6"/></g><text class="lg" x="488.4" y="944" text-anchor="start">data</text>
<g class="n-store"><rect class="sh" x="604.4" y="918" width="64" height="30" rx="6"/></g><text class="lg" x="684.4" y="944" text-anchor="start">stored state</text>
