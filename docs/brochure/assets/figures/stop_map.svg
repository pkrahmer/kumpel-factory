<rect class="grp g-stall" x="48" y="48" width="464" height="232" rx="20"/><text class="grp-c k-stall" x="72" y="92" text-anchor="start">HALTS ALL WORK</text>
<path class="e e-flow" d="M 496 188 L 648 188" marker-end="url(#ah-flow)"/>
<path class="e e-flow" d="M 1008 188 L 1192 188" marker-end="url(#ah-flow)"/>
<path class="e e-flow" d="M 496 372 L 648 372" marker-end="url(#ah-flow)"/>
<path class="e e-flow" d="M 496 588 L 648 588" marker-end="url(#ah-flow)"/>
<path class="e e-flow" d="M 496 772 L 648 772" marker-end="url(#ah-flow)"/>
<path class="e e-flow" d="M 1008 572 L 1192 572" marker-end="url(#ah-flow)"/>
<path class="e e-ask" d="M 280 520 L 280 448" marker-end="url(#ah-ask)"/>
<g class="n-stall"><rect class="sh" x="64" y="120" width="432" height="136" rx="16"/><text class="nt" x="280" y="176.28" text-anchor="middle">Stop</text><text class="nb" x="280" y="230.24" text-anchor="middle">machine, repository</text></g>
<g class="n-ask"><rect class="sh" x="64" y="304" width="432" height="136" rx="16"/><text class="nt" x="280" y="360.28" text-anchor="middle">Question</text><text class="nb" x="280" y="414.24" text-anchor="middle">a cap included</text></g>
<g class="n-stall"><rect class="sh" x="64" y="520" width="432" height="136" rx="16"/><text class="nt" x="280" y="576.28" text-anchor="middle">Stall</text><text class="nb" x="280" y="630.24" text-anchor="middle">no usable result</text></g>
<g class="n-stall"><rect class="sh" x="64" y="704" width="432" height="136" rx="16"/><text class="nt" x="280" y="760.28" text-anchor="middle">Notice</text><text class="nb" x="280" y="814.24" text-anchor="middle">event keeps failing</text></g>
<g class="n-store"><path class="sh" d="M 666 120 H 974 L 1008 154 V 246 Q 1008 256 998 256 H 666 Q 656 256 656 246 V 130 Q 656 120 666 120 Z"/><path class="fold" d="M 974 120 V 148 Q 974 154 980 154 H 1008 Z"/><text class="nt" x="832" y="176.28" text-anchor="middle">Health file</text><text class="nb" x="832" y="230.24" text-anchor="middle">one line per stop</text></g>
<g class="n-store"><path class="sh" d="M 666 304 H 968 L 1008 344 V 830 Q 1008 840 998 840 H 666 Q 656 840 656 830 V 314 Q 656 304 666 304 Z"/><path class="fold" d="M 968 304 V 338 Q 968 344 974 344 H 1008 Z"/><text class="nt" x="832" y="560.28" text-anchor="middle">Pull request</text><text class="nb" x="832" y="614.24" text-anchor="middle">one post</text></g>
<g class="n-code"><rect class="sh" x="1200" y="120" width="352" height="136" rx="16"/><text class="nt" x="1376" y="176.28" text-anchor="middle">Cause gone</text><text class="nb" x="1376" y="230.24" text-anchor="middle">next tick clears</text></g>
<g class="n-human"><rect class="sh" x="1200" y="504" width="352" height="136" rx="16"/><text class="nt" x="1376" y="560.28" text-anchor="middle">The human</text><text class="nb" x="1376" y="614.24" text-anchor="middle">answers, fixes</text></g>
<rect class="halo" x="1021.52" y="134" width="164.95" height="44" rx="6"/><text class="lb lb-flow" x="1104" y="166.24" text-anchor="middle">next tick</text>
