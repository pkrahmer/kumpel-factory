<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Built by subject</title>
<desc id="desc">The figure shows how the factory's own code is ordered: by subject, not by layer. Seven areas stand in a stack, pipeline, watching, agents, machine, work, hosting, and shared, from the top, each with a few plain words on what it holds and a bar for its size in lines of code, so that pipeline is the largest. Above it stand a box for the command line and the wiring and, beside it, a slate box for the records' schemas. No arrows join the areas, because they import each other both ways and the order is an intent, not a checked rule. A note under the stack says that every area is built in the same three layers, rules, use cases, and tools, and that imports go only downward.</desc>
