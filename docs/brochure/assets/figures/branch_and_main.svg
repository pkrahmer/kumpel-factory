<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1600" viewBox="0 0 1000 1600" role="img" aria-labelledby="title desc">
<title id="title">The record on its branch</title>
<desc id="desc">The commits of chapter 2's story in two lanes, with time running down. On the main branch stand only three: the human's start, which moved the file into progress, then the merge of the pull request, and the factory's archive. Beside it, on the story's own branch, the factory made every other commit: the first stage start, the end of the intake's run with its question, the answers copied from the pull request, and 32 more until the hand-over at the approval, 37 in all. While the story ran, its state and journal grew there, and the main branch held only the file as the human had moved it.</desc>
