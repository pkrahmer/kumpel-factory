<g class="n-code"><rect class="sh" x="432" y="224" width="504" height="120" rx="16"/><text class="tag" x="684" y="267.52" text-anchor="middle">CLAIM</text><text class="nb" x="684" y="318.24" text-anchor="middle">intake starts as vm</text></g>
