.n-quiet .tag, .k-quiet { fill: #5f6670; }
.g-quiet { stroke: #a3a8b2; }
.e-flow { stroke: #4b515c; } .ah-flow { fill: #4b515c; }
.lb-flow { fill: #2b3038; }

</style>
