.grp { fill: #ffffff; stroke: #a9b0ba; } .col-u { stroke: #a9b0ba; }
.n-human .sh { fill: #fff4df; stroke: #c27400; }
.n-human .fold { fill: #f3dab2; stroke: #c27400; }
.n-human .tag, .k-human { fill: #8a5300; }
.g-human { stroke: #c27400; }
.n-code .sh { fill: #e8f5ef; stroke: #2a8a6e; }
.n-code .fold { fill: #c2e0d5; stroke: #2a8a6e; }
.n-code .tag, .k-code { fill: #1b6651; }
.g-code { stroke: #2a8a6e; }
.n-quiet .sh { fill: #f4f5f7; stroke: #a3a8b2; }
