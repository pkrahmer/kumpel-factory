<g class="n-store"><path class="sh" d="M 56 132 A 100 20 0 0 1 256 132 V 276 A 100 20 0 0 1 56 276 Z"/><ellipse class="fold" cx="156" cy="132" rx="100" ry="20"/><text class="tag" x="156" y="207.52" text-anchor="middle">STORED</text><text class="nt" x="156" y="256.28" text-anchor="middle">Base</text></g>
<g class="n-agent"><rect class="sh" x="312" y="112" width="208" height="184" rx="16"/><text class="tag" x="416" y="187.52" text-anchor="middle">AGENT</text><text class="nt" x="416" y="236.28" text-anchor="middle">Change</text></g>
<g class="n-code"><rect class="sh" x="576" y="112" width="200" height="184" rx="16"/><text class="tag" x="676" y="187.52" text-anchor="middle">FACTORY</text><text class="nt" x="676" y="236.28" text-anchor="middle">Push</text></g>
<g class="n-store"><path class="sh" d="M 832 132 A 100 20 0 0 1 1032 132 V 276 A 100 20 0 0 1 832 276 Z"/><ellipse class="fold" cx="932" cy="132" rx="100" ry="20"/><text class="tag" x="932" y="207.52" text-anchor="middle">STORED</text><text class="nt" x="932" y="256.28" text-anchor="middle">Base</text></g>
<g class="n-code"><rect class="sh" x="1088" y="112" width="200" height="184" rx="16"/><text class="tag" x="1188" y="187.52" text-anchor="middle">FACTORY</text><text class="nt" x="1188" y="236.28" text-anchor="middle">Pull</text></g>
<g class="n-code"><rect class="sh" x="1344" y="112" width="200" height="184" rx="16"/><text class="tag" x="1444" y="161.52" text-anchor="middle">FACTORY</text><text class="nt" x="1444" y="210.28" text-anchor="middle">Move</text><text class="nt" x="1444" y="262.28" text-anchor="middle">base</text></g>
<rect class="halo" x="700.39" y="322" width="199.21" height="44" rx="6"/><text class="lb lb-plain" x="800" y="354.24" text-anchor="middle">next stage</text>
<g class="n-agent"><rect class="sh" x="48" y="438" width="64" height="30" rx="6"/></g><text class="lg" x="128" y="464" text-anchor="start">a model</text>
<g class="n-code"><rect class="sh" x="299.8" y="438" width="64" height="30" rx="6"/></g><text class="lg" x="379.8" y="464" text-anchor="start">Kumpel's code</text>
<g class="n-store"><rect class="sh" x="660.2" y="438" width="64" height="30" rx="6"/></g><text class="lg" x="740.2" y="464" text-anchor="start">stored state</text>
</svg>
