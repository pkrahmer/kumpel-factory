<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">The reset cycle of one stage</title>
<desc id="desc">One stage runs on the dataset in six steps, left to right. The dataset starts at its one snapshot, the base, and the agent changes it in its container. The factory then takes the files the role may write and pushes them, rolls the dataset back to the base, pulls the branch up to date, and moves the base forward by taking the snapshot anew. A thin line below leads from the last step back to the first, because the next stage starts from the new base.</desc>
<style>
text { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
.code { font-family: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; font-size: 1em; }
.tag { font-size: 28px; font-weight: 600; letter-spacing: 0.08em; }
.nt { font-size: 42px; font-weight: 600; }
.nb { font-size: 36px; font-weight: 400; }
.nf { font-size: 36px; font-weight: 400; }
.lb { font-size: 36px; font-weight: 400; }
.lane-h { font-size: 42px; font-weight: 600; }
.lane-n { font-size: 36px; font-weight: 400; }
.col-h { font-size: 42px; font-weight: 600; }
.col-n { font-size: 36px; font-weight: 400; }
.grp-c { font-size: 28px; font-weight: 600; letter-spacing: 0.08em; }
.tx { font-size: 36px; font-weight: 400; }
.tx-bold { font-size: 36px; font-weight: 600; }
.tx-mono { font-size: 36px; font-weight: 400; font-family: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
.tx-note { font-size: 36px; font-weight: 400; font-style: italic; }
.lg { font-size: 32px; font-weight: 400; }
.sh, .fold { stroke-width: 3; stroke-linejoin: round; }
.n-end .sh, .n-dashed .sh { stroke-dasharray: 14 8; }
.e { fill: none; stroke-linejoin: round; stroke-linecap: butt; }
.halo { stroke: none; }
.rule, .lane-a, .lane-b { stroke-width: 2; }
.rule, .col-u { fill: none; } .col-r { stroke-dasharray: 4 10; stroke-width: 3; }
.col-u { stroke-width: 3; }
.grp { stroke-width: 3; } .grp-d { stroke-dasharray: 14 10; }
.e-flow { stroke-width: 4; }
.e-plain { stroke-width: 3; }
.bg { fill: #ffffff; }
.nt, .lane-h, .col-h, .tx-bold { fill: #1b1f24; }
.lane-n, .col-n, .grp-c, .tx-note, .nf { fill: #565d69; }
.nb, .tx, .tx-mono, .lg { fill: #30353d; }
.halo { fill: #ffffff; } .halo.on-lane { fill: #f3f5f8; }
.lane-a { fill: #f3f5f8; stroke: #d5dae0; }
.lane-b { fill: #ffffff; stroke: #d5dae0; }
.rule { stroke: #d5dae0; }
.grp { fill: #ffffff; stroke: #a9b0ba; } .col-u { stroke: #a9b0ba; }
.n-agent .sh { fill: #eaf2fc; stroke: #2f6db5; }
.n-agent .fold { fill: #c5d7ee; stroke: #2f6db5; }
.n-agent .tag, .k-agent { fill: #245a99; }
.g-agent { stroke: #2f6db5; }
.n-code .sh { fill: #e8f5ef; stroke: #2a8a6e; }
.n-code .fold { fill: #c2e0d5; stroke: #2a8a6e; }
.n-code .tag, .k-code { fill: #1b6651; }
.g-code { stroke: #2a8a6e; }
.n-store .sh { fill: #f4f1ea; stroke: #8a7a5c; }
.n-store .fold { fill: #dfd9ce; stroke: #8a7a5c; }
.n-store .tag, .k-store { fill: #635640; }
.g-store { stroke: #8a7a5c; }
.e-flow { stroke: #4b515c; } .ah-flow { fill: #4b515c; }
.lb-flow { fill: #2b3038; }
.e-plain { stroke: #8f96a1; } .ah-plain { fill: #8f96a1; }
.lb-plain { fill: #565d69; }

</style>
<defs><marker id="ah-flow" viewBox="0 0 10 10" refX="6.67" refY="5" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-flow" d="M0.5 1 L10 5 L0.5 9 L2.6 5 Z"/></marker><marker id="ah-plain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-plain" d="M0.5 1 L10 5 L0.5 9 L2.6 5 Z"/></marker></defs>
