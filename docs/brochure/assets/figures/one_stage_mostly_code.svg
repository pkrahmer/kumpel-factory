<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">One stage, mostly code</title>
<desc id="desc">One stage of the line, laid out as its seven steps in the order they run. Six of the steps are the factory's code: the claim, the reset of the dataset to its base, the take, the decision against the stage's allowed moves, the checks, and the commit and push. One step, the agent's run in its container, is a model at work, and it ends with one word that the code reads. The checks run only when that word moves the story forward, and a move back or a question goes straight to the commit. The figure shows that a model acts in one step of seven, and that code decides what that step may change and where the work goes next.</desc>
<style>
