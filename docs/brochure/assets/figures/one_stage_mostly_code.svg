<g class="n-code"><rect class="sh" x="48" y="152" width="304" height="232" rx="16"/><text class="nt" x="200" y="256.28" text-anchor="middle">Claim</text><text class="nb" x="200" y="310.24" text-anchor="middle">push the claim</text></g>
<g class="n-code"><rect class="sh" x="448" y="152" width="304" height="232" rx="16"/><text class="nt" x="600" y="256.28" text-anchor="middle">Reset</text><text class="nb" x="600" y="310.24" text-anchor="middle">to the base</text></g>
<g class="n-agent"><rect class="sh" x="848" y="152" width="304" height="232" rx="16"/><text class="tag" x="1000" y="203.52" text-anchor="middle">MODEL</text><text class="nt" x="1000" y="252.28" text-anchor="middle">Agent run</text><text class="nb" x="1000" y="306.24" text-anchor="middle">ends in one</text><text class="nb" x="1000" y="350.24" text-anchor="middle">word</text></g>
<g class="n-code"><rect class="sh" x="1248" y="152" width="304" height="232" rx="16"/><text class="nt" x="1400" y="234.28" text-anchor="middle">Take</text><text class="nb" x="1400" y="288.24" text-anchor="middle">role's files</text><text class="nb" x="1400" y="332.24" text-anchor="middle">only</text></g>
<g class="n-code"><rect class="sh" x="48" y="552" width="304" height="232" rx="16"/><text class="nt" x="200" y="656.28" text-anchor="middle">Decide</text><text class="nb" x="200" y="710.24" text-anchor="middle">allowed moves</text></g>
<g class="n-code"><rect class="sh" x="448" y="552" width="304" height="232" rx="16"/><text class="nt" x="600" y="634.28" text-anchor="middle">Checks</text><text class="nb" x="600" y="688.24" text-anchor="middle">forward</text><text class="nb" x="600" y="732.24" text-anchor="middle">moves only</text></g>
<g class="n-code"><rect class="sh" x="848" y="552" width="304" height="232" rx="16"/><text class="nt" x="1000" y="608.28" text-anchor="middle">Commit,</text><text class="nt" x="1000" y="660.28" text-anchor="middle">push</text><text class="nb" x="1000" y="714.24" text-anchor="middle">result and</text><text class="nb" x="1000" y="758.24" text-anchor="middle">records</text></g>
<rect class="halo" x="445.42" y="802" width="309.15" height="44" rx="6"/><text class="lb lb-dashed" x="600" y="834.24" text-anchor="middle">back or question</text>
<g class="n-agent"><rect class="sh" x="48" y="918" width="64" height="30" rx="6"/></g><text class="lg" x="128" y="944" text-anchor="start">a model</text>
<g class="n-code"><rect class="sh" x="299.8" y="918" width="64" height="30" rx="6"/></g><text class="lg" x="379.8" y="944" text-anchor="start">Kumpel's code</text>
<path class="e e-flow" d="M 660.2 933 L 716.2 933" marker-end="url(#ah-flow)"/><text class="lg" x="740.2" y="944" text-anchor="start">moves on</text>
