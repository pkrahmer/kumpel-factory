.e { fill: none; stroke-linejoin: round; stroke-linecap: butt; }
.halo { stroke: none; }
.rule, .lane-a, .lane-b { stroke-width: 2; }
.rule, .col-u { fill: none; } .col-r { stroke-dasharray: 4 10; stroke-width: 3; }
.col-u { stroke-width: 3; }
.grp { stroke-width: 3; } .grp-d { stroke-dasharray: 14 10; }
.e-flow { stroke-width: 4; }
.e-dashed { stroke-width: 3; stroke-dasharray: 10 10; }
.bg { fill: #ffffff; }
