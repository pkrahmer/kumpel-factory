<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">The factory at a glance</title>
<desc id="desc">The whole factory in one picture, in two halves. On the left, the human stands above the hosting service, which holds the pull requests and the project's repository, and inside the repository the work items and the records the factory writes, where the truth about all work is kept. On the right, the machine holds the factory's loop, the dataset with its one base snapshot, and two throwaway containers on that dataset, one in which an agent runtime runs a model and one in which a check runs. The loop fetches from the repository, resets the dataset, starts the containers, carries the take out of the agent's container, and pushes the result and the records back into the repository. Only git and the pull requests cross from one half to the other.</desc>
