<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">The hand-over on the pull request</title>
<desc id="desc">A facsimile, abridged, of the pull request of chapter 2's story at its approval. At the top stand the story's title, a mark that the pull request is ready rather than a draft, and the label that names the approval stage. Below come the description the factory wrote from the work item, with the story's sections, the reviewer's verdict of no findings and the smoke tester's last line, and then the factory's post with the bill and the line that counts the human, ending in a faint hidden marker. At the foot, the human's one act: the merge.</desc>
