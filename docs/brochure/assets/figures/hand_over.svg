<g class="n-code"><path class="sh" d="M 58 184 H 904 L 944 224 V 662 Q 944 672 934 672 H 58 Q 48 672 48 662 V 194 Q 48 184 58 184 Z"/><path class="fold" d="M 904 184 V 218 Q 904 224 910 224 H 944 Z"/><text class="tag" x="68" y="227.52" text-anchor="start">DESCRIPTION</text><text class="nt" x="68" y="276.28" text-anchor="start">by the factory</text><text class="nb" x="68" y="330.24" text-anchor="start">## Description ...</text><text class="nb" x="68" y="374.24" text-anchor="start">## Acceptance criteria 1 ... 13</text><text class="nb" x="68" y="418.24" text-anchor="start">## Tests ...</text><text class="nb" x="68" y="462.24" text-anchor="start">## Review ... no findings</text><text class="nb" x="68" y="506.24" text-anchor="start">## Documentation ...</text><text class="nb" x="68" y="550.24" text-anchor="start">## Smoke test ... Findings: none.</text><text class="nb" x="68" y="594.24" text-anchor="start">## Commits ...</text><text class="nb" x="68" y="638.24" text-anchor="start">Merge to accept the story. ...</text></g>
