<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<!-- drawn from the cost sidecars: 208 stories; stories per whole dollar ($0 51, $1 49, $2 37, $3 25, $4 11, $5 14, $6 7, $7 2, $8+ 12); median $2.13; dearest $17.02; F0045-S0002 $5.57 -->
<title id="title">What a story costs</title>
<desc id="desc">A histogram of the 208 stories of the whole record by their cost at list price, in bins of one whole dollar. The bars are tallest at the left, with 51 stories under one dollar and 49 between one and two, and they fall to the right, with a last bar of 12 stories at eight dollars or more. A vertical line marks the median story at $2.13, and a small label marks the story of chapter 2, the page-cache fix, at $5.57, in the bar from five to six dollars. Most stories cost under three dollars, and the long tail to the right is where the rework is.</desc>
