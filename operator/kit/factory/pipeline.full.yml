# The full line (kumpel-factory's kit): intake, tester, coder, reviewer, documenter and smoke tester,
# then the human's approval, and an acceptance per feature. All agents are the factory's installed
# ones; a file factory/agents/<role>.md in this repository replaces one of them. Every time is in minutes.
contract: "1.2"
attempts_cap: 2
crash_cap: 2
acceptance_stage: acceptance
# An existing repository that keeps its own root Makefile names the factory's makefile here:
# make_file: factory/Makefile
project_commands:
  check: {time_limit: 10}
  lint: {time_limit: 5}
  test: {time_limit: 10}
  sync: {time_limit: 5}            # the tools after a checkout: the stage environment runs it, no stage lists it
  facts-diff: {time_limit: 1}      # start facts: the branch's diff, for the reviewers
  facts-changes: {time_limit: 1}   # the changed and new files, for the coder and the documenter
  facts-files: {time_limit: 1}     # the tracked files, for the tester
roles:
  # The project's: the folders and files each role may write. Everything else is the human's.
  intake: {write_paths: ["{work_item}"]}
  tester: {write_paths: ["tests/*"]}
  coder: {write_paths: ["src/*"]}
  reviewer: {write_paths: ["{work_item}"]}
  documenter: {write_paths: ["README.md", "docs/*"]}
  smoke-tester: {write_paths: ["{work_item}"]}
  acceptance-reviewer: {write_paths: ["{work_item}", "{feature}/backlog/*"]}
stages:
  intake: {role: intake, next: [tests]}
  tests: {role: tester, next: [doing], checks: [lint], reports: [test], context: [facts-files]}
  doing: {role: coder, next: [review, tests], context: [facts-changes]}
  review: {role: reviewer, next: [docs, doing, tests], round_cap: 3, context: [facts-diff]}
  docs: {role: documenter, next: [smoke-test, doing], round_cap: 3, context: [facts-changes]}
  smoke-test: {role: smoke-tester, next: [approval, doing, docs], checks: [check], round_cap: 3}
  acceptance: {role: acceptance-reviewer, next: [approval]}
  approval: {approval: true, next: [done, doing]}
  done: {}
